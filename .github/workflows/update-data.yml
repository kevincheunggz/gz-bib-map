name: 更新餐厅名单

# 每天运行一次：
#   - 列表距上次刷新满 25 天时，重新抓全球列表（约 400 页，二三十分钟）
#   - 其余时间给还没有地址的餐厅补抓详情页（每次最多 60 分钟）
on:
  schedule:
    - cron: "17 2 * * *"   # 北京时间每天 10:17
  workflow_dispatch:
    inputs:
      force_list:
        description: "强制重新抓取全球列表"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与无头浏览器
        run: |
          pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium

      - name: 抓取米其林名单
        run: |
          ARGS="--details 60"
          if [ "${{ inputs.force_list }}" = "true" ]; then ARGS="$ARGS --list"; fi
          python scripts/scrape.py $ARGS

      - name: 提交变化
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json data/meta.json
          if git diff --cached --quiet; then
            echo "名单无变化"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "更新米其林名单 $(date -u -d '+8 hour' +%F)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 刷新 jsDelivr 缓存
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 20
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/meta.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/restaurants.json" || true
