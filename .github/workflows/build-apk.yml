name: 打包安卓 App

on:
  push:
    branches: [main]
    paths: ["app/**", "web/**", "*.gradle.kts", "gradle.properties", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未设置 KEYSTORE_BASE64，将使用临时调试签名"
          fi

      - name: 编译 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAIDU_AK: ${{ secrets.BAIDU_AK }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/gz-bib-map.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gz-bib-map-apk
          path: out/gz-bib-map.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/gz-bib-map.apk \
            --title "广州必比登 v1.${GITHUB_RUN_NUMBER}" \
            --notes "安装包随代码更新自动生成。餐厅名单每月自动核对，App 打开时自动拉取，一般无需重新安装。"
