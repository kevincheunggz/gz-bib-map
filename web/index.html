<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>广州必比登</title>
<style>
  :root{
    --red:#c8102e; --navy:#1f4e79; --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e3df;
    --bg:#faf8f5; --card:#ffffff; --chip:#f1ede8; --hl:#fff4f2; --me:#1a73e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px}
  #map{position:fixed;inset:0;background:#ece8e2}
  .nomap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;padding:0 24px 50vh;text-align:center;
    background:repeating-linear-gradient(135deg,#f3efe9 0 14px,#efeae3 14px 28px)}

  /* 顶部 */
  .top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
  .bar{pointer-events:auto;display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:6px 6px 6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .bar .logo{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
  .bar input{flex:1;min-width:0;border:0;outline:none;font-size:15px;padding:6px 0;background:transparent}
  .ibtn{flex:none;border:0;background:var(--chip);border-radius:10px;height:34px;min-width:34px;padding:0 10px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:4px}
  .ibtn.on{background:var(--ink);color:#fff}
  .ibtn svg{width:16px;height:16px}
  .chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--card);color:var(--ink);padding:6px 11px;border-radius:999px;font-size:13px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .chip.on{background:var(--ink);color:#fff}
  .chip .n{opacity:.55;margin-left:3px;font-size:11px}
  .chip.new{color:var(--red)} .chip.new.on{background:var(--red);color:#fff}

  /* 底部抽屉 */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.12);
    display:flex;flex-direction:column;height:44vh;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom)}
  .sheet.min{height:92px} .sheet.full{height:calc(100vh - 118px - env(safe-area-inset-top))}
  .handle{padding:8px 14px 6px;flex:none}
  .handle .grip{width:40px;height:4px;border-radius:2px;background:#cfc9c1;margin:0 auto 8px}
  .handle .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .handle .ttl{font-weight:600;font-size:15px}
  .handle .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .seg{display:flex;background:var(--chip);border-radius:9px;padding:2px;flex:none}
  .seg button{border:0;background:transparent;font-size:12px;padding:5px 9px;border-radius:7px;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .list{flex:1;overflow-y:auto;padding:0 8px 14px;-webkit-overflow-scrolling:touch}
  .item{display:flex;gap:10px;padding:10px 8px;border-radius:12px;align-items:flex-start}
  .item:active{background:var(--card)}
  .item.sel{background:var(--hl);box-shadow:inset 3px 0 0 var(--red)}
  .num{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .p1{background:var(--red)} .p2{background:var(--navy)}
  .body{min-width:0;flex:1}
  .nm{font-weight:600;font-size:15px}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;color:#fff;background:var(--red);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:2px}
  .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .ad{color:#444;font-size:12.5px;margin-top:3px;line-height:1.45}
  .dist{flex:none;font-size:12px;color:var(--me);font-weight:600;margin-top:3px}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px}

  /* 浮动按钮 */
  .fabs{position:fixed;right:12px;z-index:14;display:flex;flex-direction:column;gap:8px;transition:bottom .25s ease}
  .fab{width:42px;height:42px;border-radius:12px;border:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .fab svg{width:20px;height:20px}
  .fab.on{color:var(--me)}

  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translateX(-50%);z-index:40;background:rgba(29,29,31,.88);color:#fff;font-size:12.5px;
    padding:7px 12px;border-radius:9px;max-width:86vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}

  /* 首次设置 */
  .setup{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 28px) 18px 30px}
  .setup.show{display:block}
  .setup h2{margin:0 0 8px;font-size:20px}
  .setup p,.setup li{color:#444;line-height:1.7;font-size:14px}
  .setup ol{padding-left:20px;margin:8px 0 16px}
  .setup code{background:var(--chip);padding:1px 5px;border-radius:4px}
  .setup a{color:var(--navy)}
  .setup input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;outline:none;background:var(--card)}
  .setup input:focus{border-color:var(--red)}
  .setup .btns{display:flex;gap:10px;margin-top:12px}
  .setup button{flex:1;border:0;border-radius:12px;padding:12px;font-size:15px}
  .setup .go{background:var(--red);color:#fff}
  .setup .skip{background:var(--chip);color:var(--ink)}
  .setup .err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}

  /* 信息窗 */
  .iw{font-size:13px;line-height:1.6;max-width:240px}
  .iw .t{font-weight:600;font-size:15px;margin-bottom:2px}
  .iw .s{color:var(--muted);font-size:12px}
  .iw .acts{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .iw a{display:inline-block;text-decoration:none;font-size:12.5px;padding:4px 9px;border-radius:7px;background:var(--chip);color:var(--ink)}
  .iw a.pri{background:var(--red);color:#fff}
</style>
</head>
<body>
<div id="map"></div>
<div class="nomap" id="nomap">地图未加载。点右上角“设置”填写百度地图 AK，或直接在下方列表中浏览。</div>

<div class="top">
  <div class="bar">
    <span class="logo"></span>
    <input id="q" type="search" placeholder="搜索店名、地址、菜系" enterkeyhint="search">
    <button class="ibtn" id="priceBtn">价位</button>
    <button class="ibtn" id="setBtn" aria-label="设置">设置</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="fabs" id="fabs">
  <button class="fab" id="locBtn" aria-label="我的位置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="fab" id="fitBtn" aria-label="显示全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div class="sheet" id="sheet">
  <div class="handle" id="handle">
    <div class="grip"></div>
    <div class="row">
      <div><div class="ttl" id="count">广州 · 米其林必比登</div><div class="sub" id="updated"></div></div>
      <div class="seg" id="sortSeg"><button data-sort="" class="on">默认</button><button data-sort="near">离我最近</button></div>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>

<div class="setup" id="setup">
  <h2>连接百度地图</h2>
  <p>地图显示需要一个免费的百度地图“浏览器端 AK”。只需设置一次，之后打开 App 会自动加载。</p>
  <ol>
    <li>打开 <a href="https://lbsyun.baidu.com/apiconsole/key">百度地图开放平台控制台</a>，登录百度账号，进入“应用管理 → 我的应用 → 创建应用”。</li>
    <li>应用类型选 <b>浏览器端</b>，Referer 白名单填 <code>*</code>，提交。</li>
    <li>复制生成的 AK，粘贴到下面。</li>
  </ol>
  <input id="akInput" placeholder="粘贴百度地图 AK" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="btns"><button class="skip" id="akSkip">先看列表</button><button class="go" id="akBtn">保存并加载</button></div>
  <div class="err" id="akErr"></div>
  <p style="font-size:12.5px;color:var(--muted);margin-top:18px">名单来自米其林指南官网，每月自动核对一次，有变化时 App 打开即会更新。地址定位使用百度地图解析。</p>
</div>

<script>
/* ================= 基础 ================= */
const P = new URLSearchParams(location.search);
const REPO = P.get("repo") || "";
const REMOTE = REPO ? `https://cdn.jsdelivr.net/gh/${REPO}@main/data/restaurants.json` : "";
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){ return null; } }
function toast(t,ms){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"), ms||2600); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* 坐标转换 WGS84 → GCJ02 → BD09 */
const PI=Math.PI, A=6378245.0, EE=0.00669342162296594323;
function tLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r;}
function tLng(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r;}
function wgs2gcj(lat,lng){let dLat=tLat(lng-105,lat-35),dLng=tLng(lng-105,lat-35);const rad=lat/180*PI;let m=Math.sin(rad);m=1-EE*m*m;const s=Math.sqrt(m);dLat=dLat*180/((A*(1-EE))/(m*s)*PI);dLng=dLng*180/(A/s*Math.cos(rad)*PI);return [lat+dLat,lng+dLng];}
function gcj2bd(lat,lng){const z=Math.sqrt(lng*lng+lat*lat)+0.00002*Math.sin(lat*PI*3000/180);const t=Math.atan2(lat,lng)+0.000003*Math.cos(lng*PI*3000/180);return [z*Math.sin(t)+0.006, z*Math.cos(t)+0.0065];}
function haversine(a,b){const R=6371000,r=x=>x*PI/180;const dLat=r(b[0]-a[0]),dLng=r(b[1]-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function inGZ(lat,lng){ return lat>22.4 && lat<23.95 && lng>112.9 && lng<114.1; }
function fmtDist(m){ return m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(m<10000?1:0)+" km"; }

/* ================= 状态 ================= */
const S = { data:null, rows:[], map:null, markers:{}, sel:null, me:null, meMarker:null, sort:"",
  filt:{q:"",cuisine:"",price:"",fresh:false}, geo:{} };
try{ S.geo = JSON.parse(store("bib_geo_v2")||"{}")||{}; }catch(e){ S.geo={}; }
function saveGeo(){ store("bib_geo_v2", JSON.stringify(S.geo)); }

/* ================= 数据 ================= */
function validData(d){ return d && Array.isArray(d.restaurants) && d.restaurants.length>=20; }
function newer(a,b){ if(!validData(a)) return validData(b)?b:null; if(!validData(b)) return a; return (a.updated||"")>=(b.updated||"") ? a : b; }
function daysSince(s){ if(!s) return 1e9; return (Date.now()-new Date(s+"T00:00:00+08:00").getTime())/864e5; }
function prepare(d){
  S.data = d;
  S.rows = d.restaurants.map((r,i)=>{
    const o = Object.assign({}, r, {id:i+1});
    o.district = (String(o.addr||"").match(/^(.{2,3}?区)/)||[,""])[1];
    if(o.lat!=null && o.lng!=null && inGZ(o.lat,o.lng)) o.bd = gcj2bd(o.lat,o.lng); else o.bd = null;
    o.fresh = daysSince(o.added) <= 120;
    return o;
  });
}
async function fetchJSON(url, ms){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms||8000);
  try{ const r = await fetch(url,{signal:ctl.signal,cache:"no-store"}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function loadData(){
  let cached=null; try{ cached = JSON.parse(store("bib_data")||"null"); }catch(e){}
  let bundled=null; try{ bundled = await fetchJSON("restaurants.json", 4000); }catch(e){}
  const best = newer(cached, bundled);
  if(best){ prepare(best); buildChips(); rebuildMarkers(); refresh(true); }
  if(S.data && S.afterData){ const f=S.afterData; S.afterData=null; f(); }
  if(!REMOTE) return;
  try{
    const remote = await fetchJSON(REMOTE+"?t="+Math.floor(Date.now()/36e5), 9000);
    if(!validData(remote)) return;
    if(!best || (remote.updated||"") > (best.updated||"")){
      const oldSlugs = new Set(best ? best.restaurants.map(r=>r.slug) : []);
      store("bib_data", JSON.stringify(remote));
      prepare(remote); buildChips(); rebuildMarkers(); refresh(true);
      const added = remote.restaurants.filter(r=>!oldSlugs.has(r.slug)).length;
      toast(`名单已更新至 ${remote.updated}，共 ${remote.restaurants.length} 家` + (best && added ? `，新增 ${added} 家` : ""), 4000);
    }
  }catch(e){ /* 离线时继续用本地名单 */ }
}

/* ================= 筛选与列表 ================= */
function buildChips(){
  const cnt={}; S.rows.forEach(r=>cnt[r.cuisine]=(cnt[r.cuisine]||0)+1);
  const order = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const fresh = S.rows.filter(r=>r.fresh).length;
  if(S.filt.cuisine && !cnt[S.filt.cuisine]) S.filt.cuisine="";
  $("#chips").innerHTML =
    `<button class="chip${S.filt.cuisine||S.filt.fresh?"":" on"}" data-c="">全部</button>` +
    (fresh ? `<button class="chip new${S.filt.fresh?" on":""}" data-fresh="1">新上榜<span class="n">${fresh}</span></button>` : "") +
    order.map(c=>`<button class="chip${S.filt.cuisine===c?" on":""}" data-c="${esc(c)}">${esc(c)}<span class="n">${cnt[c]}</span></button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(el=>el.onclick=()=>{
    if(el.dataset.fresh){ S.filt.fresh=!S.filt.fresh; S.filt.cuisine=""; }
    else { S.filt.cuisine=el.dataset.c; S.filt.fresh=false; }
    buildChips(); refresh(true);
  });
}
function visible(r){
  const f=S.filt;
  if(f.fresh && !r.fresh) return false;
  if(f.cuisine && r.cuisine!==f.cuisine) return false;
  if(f.price && r.price!==f.price) return false;
  if(f.q && !(r.name+r.addr+r.cuisine+r.district).toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}
function posOf(r){ // 百度坐标 [lat,lng]
  const g=S.geo[r.slug];
  if(g && g.a===r.addr && g.pt) return g.pt;
  return r.bd;
}
function distOf(r){ const p=posOf(r); return (S.me && p) ? haversine(S.me,p) : null; }
function refresh(updateMarkers){
  if(!S.data) return;
  let rows = S.rows.filter(visible);
  if(S.sort==="near" && S.me) rows = rows.slice().sort((a,b)=>(distOf(a)??1e12)-(distOf(b)??1e12));
  $("#count").textContent = `必比登推介 · ${rows.length === S.rows.length ? "共 "+rows.length : rows.length+" / "+S.rows.length} 家`;
  $("#updated").textContent = `米其林指南广州 · 名单核对于 ${S.data.updated||"—"}`;
  $("#list").innerHTML = rows.length ? rows.map(r=>{
    const d = distOf(r);
    return `<div class="item${S.sel===r.slug?" sel":""}" data-s="${esc(r.slug)}">
      <div class="num ${r.price==="¥"?"p1":"p2"}">${r.id}</div>
      <div class="body">
        <div class="nm">${esc(r.name)}${r.fresh?'<span class="tag">新</span>':""}</div>
        <div class="meta">${esc(r.cuisine)} · ${esc(r.price)}${r.district?" · "+esc(r.district):""}</div>
        <div class="ad">${esc(r.addr)}</div>
      </div>
      ${d!=null?`<div class="dist">${fmtDist(d)}</div>`:""}
    </div>`;
  }).join("") : `<div class="empty">没有符合条件的餐厅</div>`;
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>focusOn(el.dataset.s, true));
  if(updateMarkers && S.map) S.rows.forEach(r=>{ const m=S.markers[r.slug]; if(m) visible(r)?m.show():m.hide(); });
}

/* ================= 抽屉 ================= */
const sheet=$("#sheet");
function setSheet(state){
  sheet.classList.remove("min","full"); if(state) sheet.classList.add(state);
  const h = state==="min" ? 92 : state==="full" ? 0 : window.innerHeight*0.44;
  $("#fabs").style.bottom = (h+12)+"px";
  $("#fabs").style.display = state==="full" ? "none" : "flex";
}
$("#handle").onclick = e=>{
  if(e.target.closest(".seg")) return;
  setSheet(sheet.classList.contains("min") ? "" : sheet.classList.contains("full") ? "min" : "full");
};
(function(){ let y0=null; const h=$("#handle");
  h.addEventListener("touchstart",e=>{ y0=e.touches[0].clientY; },{passive:true});
  h.addEventListener("touchend",e=>{ if(y0==null) return; const dy=e.changedTouches[0].clientY-y0; y0=null;
    if(Math.abs(dy)<30) return; const full=sheet.classList.contains("full"), min=sheet.classList.contains("min");
    if(dy<0) setSheet(min?"":"full"); else setSheet(full?"":"min"); e.preventDefault(); });
})();

/* ================= 百度地图 ================= */
function pinIcon(r, big){
  const c = r.price==="¥" ? "#c8102e" : "#1f4e79";
  const w = big?38:28, h = big?48:36;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 28 36"><path d="M14 35s11-11.6 11-20.5C25 7.6 20.1 3 14 3S3 7.6 3 14.5C3 23.4 14 35 14 35z" fill="${c}" stroke="#fff" stroke-width="2"/><text x="14" y="18.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="${r.id>9?10:11}" font-weight="700" fill="#fff">${r.id}</text></svg>`;
  return new BMapGL.Icon("data:image/svg+xml;charset=utf-8,"+enc(svg), new BMapGL.Size(w,h), {anchor:new BMapGL.Size(w/2,h)});
}
function bpt(p){ return new BMapGL.Point(p[1], p[0]); }
function placeMarker(r){
  const p = posOf(r); if(!p || !S.map) return;
  let m = S.markers[r.slug];
  if(!m){
    m = new BMapGL.Marker(bpt(p), {icon:pinIcon(r,S.sel===r.slug), title:r.name});
    m.addEventListener("click", ()=>focusOn(r.slug,false));
    S.map.addOverlay(m); S.markers[r.slug]=m;
    if(!visible(r)) m.hide();
  } else m.setPosition(bpt(p));
}
function rebuildMarkers(){
  if(!S.map) return;
  Object.values(S.markers).forEach(m=>S.map.removeOverlay(m)); S.markers={};
  S.rows.forEach(placeMarker); geocodeAll();
}
function navUrl(r,p){ return `https://api.map.baidu.com/marker?location=${p[0]},${p[1]}&title=${enc(r.name)}&content=${enc(r.addr)}&output=html&coord_type=bd09ll&src=webapp.gzbib`; }
function searchUrl(r){ const q=r.name.replace(/[()（）]/g," ").replace(/\s+/g," ").trim(); return `https://map.baidu.com/search/${enc(q)}/?querytype=s&wd=${enc(q)}&c=257`; }
function focusOn(slug, fromList){
  const r = S.rows.find(x=>x.slug===slug); if(!r) return;
  const prev=S.sel; S.sel=slug;
  if(!S.map){ location.href = searchUrl(r); return; }
  if(prev && S.markers[prev]){ const pr=S.rows.find(x=>x.slug===prev); if(pr) S.markers[prev].setIcon(pinIcon(pr,false)); }
  const m=S.markers[slug]; const p=posOf(r);
  if(!m || !p){ toast("这家暂无坐标，已打开百度地图搜索"); location.href=searchUrl(r); return; }
  m.setIcon(pinIcon(r,true));
  if(fromList){ setSheet("min"); S.map.centerAndZoom(m.getPosition(), Math.max(S.map.getZoom(),16)); }
  const d=distOf(r);
  const html = `<div class="iw"><div class="t">${r.id}. ${esc(r.name)}</div>
    <div class="s">${esc(r.cuisine)} · ${esc(r.price)} · 必比登推介${d!=null?" · 距你 "+fmtDist(d):""}</div>
    <div>${esc(r.addr)}</div>
    <div class="acts"><a class="pri" href="${navUrl(r,p)}">导航</a>${r.phone?`<a href="tel:${esc(r.phone.replace(/\s/g,""))}">电话</a>`:""}<a href="${esc(r.url)}">米其林点评</a></div></div>`;
  S.map.openInfoWindow(new BMapGL.InfoWindow(html,{width:0,offset:new BMapGL.Size(0,-34)}), m.getPosition());
  refresh(false);
}
function fitAll(){
  if(!S.map) return;
  const pts = S.rows.filter(visible).map(posOf).filter(Boolean).map(bpt);
  if(S.me) pts.push(bpt(S.me));
  if(pts.length) S.map.setViewport(pts,{margins:[130,30,sheet.classList.contains("min")?110:window.innerHeight*0.46,30]});
}
function geocodeAll(){
  const todo = S.rows.filter(r=>{ const g=S.geo[r.slug]; return !g || g.a!==r.addr; });
  if(!todo.length || !S.map) return;
  const gc = new BMapGL.Geocoder(); let i=0;
  const next=()=>{
    if(i>=todo.length){ saveGeo(); refresh(false); return; }
    const r=todo[i++];
    gc.getPoint("广州市"+r.addr, pt=>{
      let g={a:r.addr};
      // 优先用百度按地址解析的位置；米其林官网个别坐标有误（如雅苑），只作兜底
      if(pt && inGZ(pt.lat,pt.lng)) g.pt=[+pt.lat.toFixed(6), +pt.lng.toFixed(6)];
      S.geo[r.slug]=g; placeMarker(r); setTimeout(next,150);
    },"广州市");
  };
  next();
}
window.__bdInit = function(){
  clearTimeout(window.__bdTimer);
  const map = new BMapGL.Map("map"); S.map=map;
  map.centerAndZoom(new BMapGL.Point(113.29,23.12),12);
  map.enableScrollWheelZoom(true);
  map.addControl(new BMapGL.ScaleControl({anchor:BMAP_ANCHOR_TOP_LEFT, offset:new BMapGL.Size(14,118)}));
  $("#nomap").style.display="none"; $("#setup").classList.remove("show");
  S.rows.forEach(placeMarker); if(S.me){ showMe(false); fitNear(); } else fitAll(); geocodeAll();
};
function loadBaidu(ak){
  $("#akErr").textContent="正在加载地图……";
  const s=document.createElement("script");
  s.src=`https://api.map.baidu.com/api?v=1.0&type=webgl&ak=${enc(ak)}&callback=__bdInit`;
  s.onerror=()=>{ $("#akErr").textContent="地图脚本加载失败，请检查网络。"; $("#setup").classList.add("show"); };
  document.head.appendChild(s);
  window.__bdTimer=setTimeout(()=>{ if(!S.map){ $("#akErr").textContent="地图没有加载成功。请确认 AK 类型是“浏览器端”、Referer 白名单为 *、应用已启用。"; $("#setup").classList.add("show"); } },10000);
}

/* ================= 我的位置 ================= */
function showMe(center){
  if(!S.map || !S.me) return;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="9" fill="#1a73e8" fill-opacity=".2"/><circle cx="11" cy="11" r="5.5" fill="#1a73e8" stroke="#fff" stroke-width="2"/></svg>`;
  const icon=new BMapGL.Icon("data:image/svg+xml;charset=utf-8,"+enc(svg), new BMapGL.Size(22,22), {anchor:new BMapGL.Size(11,11)});
  if(S.meMarker) S.meMarker.setPosition(bpt(S.me));
  else { S.meMarker=new BMapGL.Marker(bpt(S.me),{icon}); S.map.addOverlay(S.meMarker); }
  if(center) S.map.centerAndZoom(bpt(S.me), 14);
}
/* 地图缩放到“我 + 最近几家店”；人不在广州附近时显示全部餐厅 */
function fitNear(){
  if(!S.map || !S.me) return;
  const near = S.rows.filter(visible).map(r=>({p:posOf(r), d:distOf(r)})).filter(x=>x.p && x.d!=null)
    .sort((a,b)=>a.d-b.d);
  if(!near.length){ showMe(true); return; }
  if(near[0].d > 30000){ fitAll(); return; }
  const pts=[bpt(S.me)].concat(near.slice(0,5).map(x=>bpt(x.p)));
  S.map.setViewport(pts,{margins:[130,40,sheet.classList.contains("min")?110:window.innerHeight*0.46,40]});
}
function afterLocate(opts){
    const ds = S.rows.map(distOf).filter(d=>d!=null);
    const far = ds.length && Math.min(...ds) > 30000;
    if(far){ if(S.sort==="near") setSort(""); else refresh(false); toast("你目前不在广州附近，已显示全部餐厅", 3500); }
    else { setSort("near"); toast(opts.auto ? "已定位，附近的店排在最前面" : "已更新你的位置"); }
    showMe(false); fitNear();
}
/* opts.auto = 打开 App 时的自动定位：失败时安静处理，被拒绝后不再自动询问 */
function locate(opts){
  opts = opts||{};
  if(!navigator.geolocation){ if(!opts.auto) toast("当前设备不支持定位"); return; }
  if(!opts.auto) toast("正在定位……",8000);
  navigator.geolocation.getCurrentPosition(pos=>{
    const g=wgs2gcj(pos.coords.latitude,pos.coords.longitude); S.me=gcj2bd(g[0],g[1]);
    store("bib_autoloc", null);
    $("#locBtn").classList.add("on");
    // 名单还没读进来时，等名单就绪再决定排序和视野
    if(!S.data){ S.afterData = ()=>afterLocate(opts); return; }
    afterLocate(opts);
  }, err=>{
    if(err.code===1){
      if(opts.auto) store("bib_autoloc","off");
      toast(opts.auto ? "未获得定位权限，可点右侧定位按钮重试" : "没有定位权限，请在系统设置里允许本 App 使用位置", 3500);
    } else if(!opts.auto) toast("定位失败，请稍后再试", 3500);
    if(S.sort==="near" && !S.me) setSort("");
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
function setSort(s){
  S.sort=s; document.querySelectorAll("#sortSeg button").forEach(b=>b.classList.toggle("on", b.dataset.sort===s));
  refresh(false); $("#list").scrollTop=0;
}
document.querySelectorAll("#sortSeg button").forEach(b=>b.onclick=e=>{
  e.stopPropagation();
  if(b.dataset.sort==="near" && !S.me){ setSort("near"); locate(); return; }
  setSort(b.dataset.sort); if(sheet.classList.contains("min")) setSheet("");
});

/* ================= 交互绑定 ================= */
$("#q").oninput = e=>{ S.filt.q=e.target.value.trim(); refresh(true); };
$("#q").onfocus = ()=>{ if(sheet.classList.contains("min")) setSheet(""); };
const PRICES=["","¥","¥¥"], PLABEL={"":"价位","¥":"¥ 实惠","¥¥":"¥¥ 中档"};
$("#priceBtn").onclick = ()=>{ S.filt.price = PRICES[(PRICES.indexOf(S.filt.price)+1)%3]; $("#priceBtn").textContent=PLABEL[S.filt.price]; $("#priceBtn").classList.toggle("on",!!S.filt.price); refresh(true); };
$("#setBtn").onclick = ()=>{ $("#akInput").value=store("bib_ak")||""; $("#akErr").textContent=""; $("#setup").classList.add("show"); };
$("#akSkip").onclick = ()=>{ $("#setup").classList.remove("show"); setSheet("full"); };
$("#akBtn").onclick = ()=>{
  const ak=$("#akInput").value.trim(); if(!ak){ $("#akErr").textContent="请先粘贴 AK。"; return; }
  const changed = ak!==store("bib_ak"); store("bib_ak",ak);
  if(S.map && changed){ location.reload(); return; }
  if(S.map){ $("#setup").classList.remove("show"); return; }
  loadBaidu(ak);
};
$("#locBtn").onclick = ()=>locate();
$("#fitBtn").onclick = fitAll;

/* ================= 启动 ================= */
setSheet("");
const urlAk = P.get("ak"); if(urlAk) store("bib_ak", urlAk);
const ak = store("bib_ak");
if(ak) loadBaidu(ak); else $("#setup").classList.add("show");
loadData();
// 打开即自动定位（用户曾拒绝定位权限时不再自动询问，可手动点定位按钮）
if(store("bib_autoloc")!=="off") locate({auto:true});
</script>
