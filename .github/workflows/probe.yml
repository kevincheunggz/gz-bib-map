name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q requests playwright
          python -m playwright install --with-deps chromium > /dev/null
          mkdir -p probe
          cat > p.py <<'PY'
          import requests, time, json
          from playwright.sync_api import sync_playwright
          B="https://guide.michelin.com/sg/zh_CN"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          urls={"all_p1":B+"/restaurants","all_p200":B+"/restaurants/page/200","star3_p1":B+"/restaurants/3-stars-michelin",
                "gz_bib":B+"/guangdong/guangzhou_1026985/restaurants/bib-gourmand",
                "detail_jp":B+"/tokyo-region/tokyo/restaurant/quintessence","detail_gz":B+"/guangdong-province/guangzhou/restaurant/nan-yuan"}
          st=[]
          s=requests.Session(); s.headers.update({"User-Agent":UA,"Accept-Language":"zh-CN,zh;q=0.9","Accept":"text/html,application/xhtml+xml"})
          r=s.get(urls["gz_bib"],timeout=30); st.append(f"requests gz_bib {r.status_code} {len(r.text)}")
          with sync_playwright() as pw:
              b=pw.chromium.launch(); pg=b.new_page(user_agent=UA, locale="zh-CN")
              for k,u in urls.items():
                  t=time.time()
                  resp=pg.goto(u, wait_until="domcontentloaded", timeout=60000)
                  for _ in range(20):
                      if pg.query_selector("h3 a[href*='/restaurant/'], h1") : break
                      pg.wait_for_timeout(1000)
                  html=pg.content(); open(f"probe/{k}.html","w").write(html)
                  st.append(f"browser {k} {resp.status if resp else '-'} {len(html)} {time.time()-t:.1f}s")
                  time.sleep(2)
              b.close()
          open("probe/status.txt","w").write("\n".join(st)+"\n")
          PY
          python p.py; cat probe/status.txt
          git config user.name probe; git config user.email probe@example.com
          git checkout -B probe-out
          git add probe && git commit -qm "probe output" && git push -f origin probe-out
